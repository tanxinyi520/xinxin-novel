  <!-- JavaScript -->
  <script>
    // 侧边栏控制
    const openSidebarBtn = document.getElementById('openSidebar');
    const closeSidebarBtn = document.getElementById('closeSidebar');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    
    // 打开侧边栏
    openSidebarBtn.addEventListener('click', () => {
      sidebar.classList.remove('-translate-x-full');
      sidebarOverlay.classList.remove('opacity-0', 'pointer-events-none');
    });
    
    // 关闭侧边栏
    closeSidebarBtn.addEventListener('click', closeSidebar);
    sidebarOverlay.addEventListener('click', closeSidebar);
    
    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
      sidebarOverlay.classList.add('opacity-0', 'pointer-events-none');
    }
    
    // 点击侧边栏菜单项时关闭侧边栏
    const navLinks = document.querySelectorAll('.nav-link');
    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        closeSidebar();
      });
    });
    
    // 保存按钮
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.addEventListener('click', () => {
      alert('设置已保存');
    });
    
    // 阅读主题切换
    const themeBtns = document.querySelectorAll('.theme-btn');
    themeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        // 移除所有按钮的选中状态
        themeBtns.forEach(b => {
          b.classList.remove('bg-primary', 'text-white');
          b.classList.add('bg-gray-100', 'text-gray-700');
        });
        
        // 添加当前按钮的选中状态
        btn.classList.remove('bg-gray-100', 'text-gray-700');
        btn.classList.add('bg-primary', 'text-white');
        
        // 切换主题
        const theme = btn.dataset.theme;
        alert(`切换到${theme}主题功能暂未实现`);
      });
    });
    
    // 字体大小滑块
    const fontSizeSlider = document.querySelector('input[type="range"][min="12"]');
    fontSizeSlider.addEventListener('input', () => {
      const value = fontSizeSlider.value;
      const displayValue = fontSizeSlider.nextElementSibling;
      displayValue.textContent = `当前大小：${value}px`;
    });
    
    // 行间距滑块
    const lineHeightSlider = document.querySelector('input[type="range"][min="1.2"]');
    lineHeightSlider.addEventListener('input', () => {
      const value = lineHeightSlider.value;
      const displayValue = lineHeightSlider.nextElementSibling;
      displayValue.textContent = `当前行间距：${value}倍`;
    });
    
    // 选择目录按钮
    const selectDirBtn = document.querySelector('button:has(.fa-folder-open)');
    selectDirBtn.addEventListener('click', () => {
      alert('选择目录功能暂未实现');
    });
  </script>
