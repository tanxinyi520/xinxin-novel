<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试页面</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f0f0f0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
    }
    p {
      color: #666;
      line-height: 1.6;
    }
    .test-card {
      background-color: #e0e0e0;
      padding: 15px;
      margin: 10px 0;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>测试页面</h1>
    <p>这是一个简单的测试页面，用于检查Electron应用是否能正常显示HTML内容。</p>
    <div class="test-card">
      <h2>测试卡片</h2>
      <p>如果您能看到这个卡片，说明基本的HTML和CSS已经正常工作。</p>
    </div>
    <div class="test-card">
      <h2>另一个测试卡片</h2>
      <p>Electron应用应该能正确渲染这些基本的HTML元素。</p>
    </div>
  </div>
  <script>
    // 简单的JavaScript测试
    console.log('页面加载完成');
    document.querySelector('h1').style.color = '#4a6cf7';
  </script>
</body>
</html>
